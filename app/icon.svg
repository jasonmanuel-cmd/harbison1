<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Harbison Standard">
  <!--
    Derived from the Harbison Standard logo mark: a gold serif H inside a gold
    crosshair ring, on the brand navy with a gold keyline. At favicon size only
    the H and the ring survive, so the wordmark is deliberately left out.
  -->
  <rect width="64" height="64" rx="10" fill="#0c1a3a"/>
  <rect x="3" y="3" width="58" height="58" rx="8" fill="none" stroke="#d4a845" stroke-width="2"/>

  <!-- crosshair ticks -->
  <g stroke="#d4a845" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="11" x2="32" y2="19"/>
    <line x1="32" y1="45" x2="32" y2="53"/>
    <line x1="11" y1="32" x2="19" y2="32"/>
    <line x1="45" y1="32" x2="53" y2="32"/>
  </g>

  <!-- ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#d4a845" stroke-width="2.5"/>

  <!-- serif H -->
  <text x="32" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#d4a845">H</text>
</svg>
